<footer class="site-footer">
  <div class="wrapper">
    {%- if site.author -%}
      <p class="footer-author">
        {% if site.author.name %}{{ site.author.name | escape }}{% endif %}
        {% if site.author.email %} · <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>{% endif %}
      </p>
    {%- endif -%}
    {%- if site.description -%}
      <p class="footer-desc">{{ site.description | escape }}</p>
    {%- endif -%}
  </div>
</footer>
